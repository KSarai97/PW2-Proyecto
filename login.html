<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login.css">
    <title>Inicio de sesión</title>
</head>

<body>
    <main class="container">
        <section class="login-form" aria-labelledby="titulo-login">
            <header class="form-header">

                <h1 id="titulo-login">Inicio de sesión</h1>
                    <p>Introduce los datos solicitados</p>
            </header>

            <form action="login.php" method="POST"  autocomplete="off">

                <div class="field">
                    <label for="id_email"> Correo electrónico: </label>
                    <input  type="email"  id="id_email"  name="id_email"  placeholder="Ingresa tu correo electrónico"  autocomplete="email"  required>
                </div>

                <div class="field"> 
                  <label for="id_pass"> Contraseña: </label>
                    <input type="password"  id="id_pass"  name="id_pass"  placeholder="Ingresa tu contraseña"  autocomplete="current-password"  required>
                </div>

                <!-- Botón de inicio de sesión -->
                <div class="form-actions">
                    <button  type="submit"  name="ok"> Aceptar</button>
                </div>
            </form>

            <footer class="form-footer">
                <p>¿Aún no tienes cuenta?<a href="registro.html">Regístrate</a></p>
            </footer>
        </section>
    </main>

</body>
</html>
