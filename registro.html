<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/registro.css">

    <title>Registro de usuario</title>
</head>

<body>

    <main class="container">

        <section class="form signup" aria-labelledby="titulo-registro">

            <!-- Encabezado del formulario -->
            <header class="form-header">

                <h1 id="titulo-registro">
                    Registro
                </h1>

                <p>
                    Introduce los datos solicitados
                </p>

            </header>


            <!-- Formulario -->
            <form
                action="registro.php"
                method="POST"
                enctype="multipart/form-data"
                autocomplete="off"
                onsubmit="return validateForm()"
            >

                <!-- Mensajes de error -->
                <div class="error-text" role="alert"></div>


                <!-- Información personal -->
                <fieldset>

                    <legend>
                        Información personal
                    </legend>


                    <div class="field">

                        <label for="fname">
                            Nombre(s):
                        </label>

                        <input
                            type="text"
                            id="fname"
                            name="fname"
                            placeholder="Ingresa nombre"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="id_apP">
                            Apellido paterno:
                        </label>

                        <input
                            type="text"
                            id="id_apP"
                            name="id_apP"
                            placeholder="Ingresa apellido"
                        >

                    </div>


                    <div class="field">

                        <label for="id_apM">
                            Apellido materno:
                        </label>

                        <input
                            type="text"
                            id="id_apM"
                            name="id_apM"
                            placeholder="Ingresa apellido"
                        >

                    </div>

                </fieldset>


                <!-- Información de acceso -->
                <fieldset>

                    <legend>
                        Información de acceso
                    </legend>


                    <div class="field">

                        <label for="id_us">
                            Nombre de usuario:
                        </label>

                        <input
                            type="text"
                            id="id_us"
                            name="id_us"
                            placeholder="Ingresa nombre de usuario"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="id_email">
                            Correo electrónico:
                        </label>

                        <input
                            type="email"
                            id="id_email"
                            name="id_email"
                            placeholder="Ingresa correo electrónico"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="id_pass">
                            Contraseña:
                        </label>

                        <input
                            type="password"
                            id="id_pass"
                            name="id_pass"
                            placeholder="Ingresa tu contraseña"
                            required
                        >

                    </div>

                </fieldset>


                <!-- Foto de perfil -->
                <fieldset>

                    <legend>
                        Foto de perfil
                    </legend>

                    <div class="file-upload-container">

                        <label for="avatar">
                            Selecciona una imagen para perfil de usuario:
                        </label>

                        <input
                            type="file"
                            id="avatar"
                            name="avatar"
                            accept="image/png, image/jpeg, image/jpg, image/gif"
                            onchange="previewImage(event)"
                            required
                        >

                        <figure class="avatar-preview">

                            <img
                                id="avatar-preview"
                                src="foto_perfil/default.png"
                                alt="Vista previa de la imagen de perfil"
                            >

                            <figcaption>
                                Vista previa de la imagen seleccionada
                            </figcaption>

                        </figure>

                    </div>

                </fieldset>


                <!-- Datos adicionales -->
                <fieldset>

                    <legend>
                        Datos adicionales
                    </legend>


                    <div class="field">

                        <label for="id_fech">
                            Fecha de nacimiento:
                        </label>

                        <input
                            type="date"
                            id="id_fech"
                            name="id_fech"
                        >

                    </div>


                    <div class="field">

                        <label for="prefe">
                            Género:
                        </label>

                        <select
                            name="pref"
                            id="prefe"
                        >

                            <option value="0">
                                Masculino
                            </option>

                            <option value="1">
                                Femenino
                            </option>

                        </select>

                    </div>


                    <div class="field">

                        <label for="est">
                            Estado:
                        </label>

                        <select
                            name="est"
                            id="est"
                        >

                            <option value="0">
                                Público
                            </option>

                            <option value="1">
                                Privado
                            </option>

                        </select>

                    </div>


                    <div class="field">

                        <label for="rol">
                            Rol:
                        </label>

                        <select
                            name="rol"
                            id="rol"
                        >

                            <option value="0">
                                Operativo
                            </option>

                            <option value="1">
                                Administrador
                            </option>

                        </select>

                    </div>

                </fieldset>


                <!-- Botón de envío -->
                <div class="form-actions">

                    <button
                        type="submit"
                        name="Aceptar"
                    >
                        Aceptar
                    </button>

                </div>

            </form>


            <!-- Enlace para usuarios registrados -->
            <footer class="form-footer">

                <p>
                    ¿Ya te has registrado?
                    <a href="login.html">
                        Ingresa desde aquí
                    </a>
                </p>

            </footer>

        </section>

    </main>


    <script src="js/registro_foto.js"></script>

</body>
</html>
