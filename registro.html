<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/registro.css">
    <title>Registro</title>
</head>
<body>
    


 <div class="container">
        <section class="form signup">
            <header>Registro</header>
            <hr>
            <p>Introduce los datos solicitados</p>
            <br><br>
            <form action="PW2-Proyecto/registro.html" method="POST" enctype="multipart/form-data" autocomplete="off">
                <div class="error-text"></div>
                <div class="name-details">
                    <div class="field input">
                        <label for="id_name">Nombre completo: </label>
                        <input type="text" name="fname" placeholder="Ingresa nombre" required>
                        <br>
                    </div>

                    <div class="field input">
                        <label for="id_nameUs">Nombre de usuario: </label>
                        <input type="text" name="id_us" placeholder="Ingresa nombre" required>
                        <br>
                    </div>

                    <div class="field input">
                        <label for="id_email">Correo electrónico: </label>
                        <input type="text" name="id_email" placeholder="Ingresa correo electronico" required>
                        <br>
                    </div>

                    <div class="field input">
                        <label>Contraseña:</label>
                        <input type="password" name="id_pass" placeholder="Ingresa tu contraseña" required>
                        <br>
                    </div>

                    <div class="field image">
                        <label for="image">Selecciona una imagen para perfil de usuario: </label>
                        <input type="file" name="image" accept="image/x-png,image/gif,image/jpeg,image/jpg" required>
                    </div>

                    <br>
                    <label for="id_fech">Fecha de Nacimiento: </label>
                    <input type="date" name="id_fech">
                    <br>

                    <label for="sexo">Género: </label>
                    <select name="pref" id="prefe">
                        <option value="0">Masculino</option>
                        <option value="1">Femenino</option>
                    </select>
                    <br>

                    <label for="estado">Estado: </label>
                    <select name="est" id="est">
                        <option value="0">Publico</option>
                        <option value="1">Privado</option>
                    </select>
                    <br>

                    <label for="rol">Rol: </label>
                    <select name="rol" id="rol">
                        <option value="0">Paciente</option>
                        <option value="1">Especialista</option>
               
                    </select>

                    <br><br>
                    <div class="field button">
                        <input type="submit" name="Aceptar"> 
                    </div>
                </form>
                <br><br>
                <div class="link" name="link">Ya te has registrado? <a href="login.html">Ingresa desde aquí</a></div>
            </section>
        </div>






     
</body>
</html>
