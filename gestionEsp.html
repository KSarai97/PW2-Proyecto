<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/GperfilEsp.css">
    <link rel="icon" type="image/png" href="img/logo.png">
    <title>Gestión perfil del especialista</title>
</head>

<body>

    <!-- Header -->
    <header class="site-header">
        <nav class="navbar">
            <ul>
                <li><a href="index.html">Página principal</a></li>
                <li><a href="perfilUs.html">Perfil de usuario</a></li>
                <li><a href="citas.html">Agendar citas</a></li>
                <li><a href="calendario.html">Calendario de citas</a></li>
                <li><a href="foro.html">Foro</a></li>
                <li>
                    <a href="login.html" title="Cerrar sesión">
                        Cerrar sesión
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="main-content">

        <div class="container">

            <div class="profile-box">

                <div class="profile-header">
                    <h1>Gestión de <em>Especialista</em></h1>
                </div>

                <div class="profile-image">
                    <img src="img/default-avatar.png" alt="Foto de perfil">
                    <figcaption>Especialista verificado</figcaption>
                </div>

                <!-- FORMULARIO -->
                <form action="#" method="post">

                    <div class="user-info">

                        <h2>Información profesional</h2>

                        <div class="form-group">
                            <label for="nombre">Nombre completo</label>
                            <input
                                type="text"
                                id="nombre"
                                name="nombre"
                                value="Dr. Nombre Apellido"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="telefono">Teléfono</label>
                            <input
                                type="text"
                                id="telefono"
                                name="telefono"
                                value="+52 81 0000 0000"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="correo">Correo electrónico</label>
                            <input
                                type="text"
                                id="correo"
                                name="correo"
                                value="doctor@ejemplo.com"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="especialidad">Especialidad</label>

                            <select id="especialidad" name="especialidad" required>
                                <option value="psicologia-clinica">
                                    Psicología Clínica
                                </option>

                                <option value="psicologia-educativa">
                                    Psicología Educativa
                                </option>

                                <option value="psicologia-organizacional">
                                    Psicología Organizacional
                                </option>

                                <option value="terapia-cognitivo-conductual">
                                    Terapia Cognitivo-Conductual
                                </option>

                                <option value="terapia-familiar">
                                    Terapia Familiar
                                </option>

                                <option value="terapia-pareja">
                                    Terapia de Pareja
                                </option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="horario">Horarios</label>

                            <select id="horario" name="horario" required>
                                <option value="lunes-viernes-manana">
                                    Lunes a Viernes: 9:00 AM - 1:00 PM
                                </option>

                                <option value="lunes-viernes-tarde">
                                    Lunes a Viernes: 2:00 PM - 6:00 PM
                                </option>

                                <option value="lunes-viernes-completo">
                                    Lunes a Viernes: 9:00 AM - 6:00 PM
                                </option>

                                <option value="lunes-sabado">
                                    Lunes a Sábado: 9:00 AM - 2:00 PM
                                </option>

                                <option value="fines-semana">
                                    Sábado y Domingo: 9:00 AM - 2:00 PM
                                </option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="modalidad">Modalidad</label>

                            <select id="modalidad" name="modalidad" required>
                                <option value="presencial">
                                    Presencial
                                </option>

                                <option value="online">
                                    En línea
                                </option>

                                <option value="ambas">
                                    Presencial y En línea
                                </option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="rol">Rol</label>

                            <select id="rol" name="rol" required>
                                <option value="paciente">
                                    Paciente
                                </option>

                                <option value="especialista" selected>
                                    Especialista
                                </option>
                            </select>
                        </div>

                    </div>

                    <!-- Acciones -->
                    <fieldset>
                        <legend>Acciones</legend>

                        <div class="button-group">

                            <button
                                type="submit"
                                name="modificar"
                                value="Modificar">
                                Modificar
                            </button>

                            <button
                                type="submit"
                                name="eliminar"
                                value="Eliminar">
                                Eliminar
                            </button>

                            <a
                                href="perfilEspecialista.html"
                                class="button cancel-button">
                                Cancelar
                            </a>

                        </div>
                    </fieldset>

                </form>

            </div>

        </div>

    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Brote psique. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
